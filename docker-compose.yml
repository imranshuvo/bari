# House Cost Planner – everything in one stack for Coolify (Build pack: Docker Compose).
#
#   app     the website (nginx + PHP on port 8080) – runs database migrations on start
#   worker  sends WhatsApp / SMS / email messages in the background
#   db      PostgreSQL
#   waha    WhatsApp gateway (scan a QR code once in its dashboard)
#   backup  nightly copy of the database and bill photos, kept 14 days
#
# SERVICE_* variables are generated by Coolify (passwords, keys) and kept between deploys.
# Domains are set in Coolify → Domains, see docs/handbook.md.
# The worker repeats the app's settings on purpose (Coolify doesn't support YAML anchors well).

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Coolify creates the domain for this service (port 8080) and keeps APP_URL in step with it.
      SERVICE_URL_APP_8080: /
      APP_NAME: Bari
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:${SERVICE_REALBASE64_32_APPKEY}
      APP_URL: ${SERVICE_URL_APP_8080}
      LOG_CHANNEL: stderr

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: house_cost_planner
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-false}

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-bari@imrankhanshuvo.com}
      MAIL_FROM_NAME: Bari

      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${SERVICE_PASSWORD_WAHAKEY}
      WAHA_SESSION: default

      SMS_GATE_USERNAME: ${SMS_GATE_USERNAME}
      SMS_GATE_PASSWORD: ${SMS_GATE_PASSWORD}
    volumes:
      - app-files:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]
    environment:
      AUTORUN_ENABLED: "false"
      APP_NAME: Bari
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:${SERVICE_REALBASE64_32_APPKEY}
      APP_URL: ${SERVICE_URL_APP_8080}
      LOG_CHANNEL: stderr

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: house_cost_planner
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-false}

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-bari@imrankhanshuvo.com}
      MAIL_FROM_NAME: Bari

      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${SERVICE_PASSWORD_WAHAKEY}
      WAHA_SESSION: default

      SMS_GATE_USERNAME: ${SMS_GATE_USERNAME}
      SMS_GATE_PASSWORD: ${SMS_GATE_PASSWORD}
    volumes:
      - app-files:/var/www/html/storage/app  # shares the app notification keys and bill photos
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy  # app runs the database migrations first

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: house_cost_planner
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d house_cost_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  waha:
    # On an ARM server (e.g. Hetzner CAX, Oracle Ampere) use devlikeapro/waha:arm instead.
    image: devlikeapro/waha:latest
    restart: unless-stopped
    environment:
      SERVICE_URL_WAHA_3000: /  # Coolify creates the domain for the WhatsApp dashboard
      WAHA_API_KEY: ${SERVICE_PASSWORD_WAHAKEY}
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${SERVICE_PASSWORD_WAHADASHBOARD}
      WHATSAPP_SWAGGER_USERNAME: admin
      WHATSAPP_SWAGGER_PASSWORD: ${SERVICE_PASSWORD_WAHADASHBOARD}
    volumes:
      - waha-sessions:/app/.sessions

  backup:
    build: ./docker/backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: house_cost_planner
      PGUSER: ${SERVICE_USER_POSTGRES}
      PGPASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-21}  # 21:00 UTC = 03:00 in Bangladesh
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
      - app-files:/files
    depends_on:
      db:
        condition: service_healthy

volumes:
  app-files:
  db-data:
  waha-sessions:
  backups:
