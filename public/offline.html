<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#047857">
    <title>Bari – offline</title>
    <style>
        :root { color-scheme: light dark; --bg: #ffffff; --text: #18181b; --muted: #52525b; }
        @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --text: #fafafa; --muted: #a1a1aa; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
               font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Bengali", sans-serif; text-align: center; }
        main { padding: 32px 16px; max-width: 360px; }
        img { width: 72px; height: 72px; border-radius: 20px; }
        h1 { font-size: 22px; margin: 20px 0 8px; }
        p { color: var(--muted); line-height: 1.5; margin: 0 0 6px; }
        button { margin-top: 20px; border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 600;
                 background: #047857; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Bari will load again when you're connected.</p>
    <p lang="bn">আপনি এখন অফলাইনে। ইন্টারনেট ফিরলে Bari আবার চালু হবে।</p>
    <button type="button" onclick="location.reload()">Try again · আবার চেষ্টা করুন</button>
</main>
</body>
</html>
